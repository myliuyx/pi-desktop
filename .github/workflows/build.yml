# electron-builder 三平台桌面构建流水线。
#
# 触发：手动（workflow_dispatch）或推送 v* tag。
# 产物：windows NSIS 安装包 / mac dmg+zip / linux AppImage+deb，先上传为
#       按 OS 命名的 artifact（desktop-Windows / desktop-macOS / desktop-Linux）；
#       tag 推送时再由 release job 把安装包挂到该 tag 的 GitHub Release Assets
#       （手动触发不发 Release，只出 artifact——那时没有 tag 可挂）。
#
# 顺序约束：desktop 的 electron-builder 会把 ../ui/dist、../core/dist、
# ../core/node_modules 以 extraResources 打进安装包，
# 因此必须先构建 ui 和 core，再执行 electron-builder（下方 step 顺序已保证）。

name: build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # monorepo：各包自带 package-lock.json，声明路径以便 npm 缓存生效
          cache-dependency-path: packages/**/package-lock.json

      # 1) 前端：产物在 packages/ui/dist，供 core 同源托管、被 electron-builder 打包
      - name: Build ui
        working-directory: packages/ui
        run: |
          npm ci
          npm run build

      # 2) 后端：产物在 packages/core/dist，被 electron-builder 打包
      - name: Build core
        working-directory: packages/core
        run: |
          npm ci
          npm run build

      # 3) 打包桌面：直接用 npx electron-builder（不经包装脚本），不发布。
      #    Windows 上默认走 NSIS 目标。
      #    macOS：本仓库无签名/公证证书，electron-builder 检测不到证书会自动跳过
      #    mac 签名与公证，产物为未签名的 dmg/zip（本机首开需放行 Gatekeeper）。
      # 3) 打包桌面：装依赖 → tsc 编译壳（dist/ 进 asar）→ electron-builder。
      #    Windows 上默认走 NSIS 目标。
      #    macOS：本仓库无签名/公证证书，electron-builder 检测不到证书会自动跳过
      #    mac 签名与公证，产物为未签名的 dmg/zip（本机首开需放行 Gatekeeper）。
      - name: Package desktop
        working-directory: packages/desktop
        run: |
          npm ci
          npm run build
          npx electron-builder --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            packages/desktop/release/*.exe
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.deb

  # 发 Release：把安装包挂到 tag 的 Release Assets（v0.1.1 用户反馈：tag 页只有源码包）。
  # 任一平台打包失败不阻塞发版——已成功平台的包照挂（download 只取存在的 artifact）；
  # 全军覆没时下方守卫步骤显式报错退出。手动触发（无 tag）时跳过。
  release:
    name: release (attach installers)
    needs: build
    if: ${{ !cancelled() && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: assets

      - name: Ensure at least one artifact
        run: |
          count=$(ls -1 assets | wc -l)
          echo "收到 $count 个安装包"
          if [ "$count" -eq 0 ]; then
            echo "::error::三平台均未产出安装包，无法发 Release"
            exit 1
          fi

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true

  # npm 发布：tag 推送时发 @myliuyx/pi-web（自托管 web 形态的 CLI 包，npx 即跑）。
  # 依赖仓库 secret NPM_TOKEN（npm automation token，账号须拥有 myliuyx scope）；
  # 未配置时降级为警告跳过——桌面构建与 Release 不受影响，配置后重打 tag 即补发。
  publish:
    name: publish @myliuyx/pi-web
    needs: build
    if: ${{ !cancelled() && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check NPM_TOKEN
        id: token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 NPM_TOKEN secret，跳过 npm 发布（配置后重打 tag 即可补发 @myliuyx/pi-web）"
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ui
        if: steps.token.outputs.have == 'true'
        working-directory: packages/ui
        run: npm ci && npm run build

      - name: Build core
        if: steps.token.outputs.have == 'true'
        working-directory: packages/core
        run: npm ci && npm run build

      - name: Assemble package
        if: steps.token.outputs.have == 'true'
        working-directory: packages/web
        run: npm run assemble

      - name: Publish
        if: steps.token.outputs.have == 'true'
        working-directory: packages/web
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
